name: repro

on:
  push:
  workflow_dispatch:

jobs:
  cmake-abi:
    name: libuv ${{ matrix.libuv }} (${{ matrix.expect }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - libuv: 1.52.1-1
            expect: ok
          - libuv: 1.53.0-1
            expect: hang
    steps:
      - uses: actions/checkout@v7

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          add-to-path: false
          packages: cmake=4.4.4-1 libuv1=${{ matrix.libuv }} cygwin=3.6.11-1 mingw64-x86_64-gcc-core mingw64-x86_64-gcc-g++ mingw64-x86_64-binutils make

      - name: Run ABI check
        shell: D:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        env:
          CHERE_INVOKING: "1"
          EXPECT: ${{ matrix.expect }}
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          sh ./run.sh
