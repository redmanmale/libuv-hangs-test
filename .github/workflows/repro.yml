name: repro

on:
  push:
  workflow_dispatch:

jobs:
  cmake-abi:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same packages as the hung µTox job. The two-line project returns
          # from the ABI check. These modes add one piece of that configure.
          - name: toolchain
            mode: toolchain
            expect: hang
            packages: cmake=4.4.4-1 libuv1=1.53.0-1 cygwin=3.6.11-1 mingw64-x86_64-gcc-core mingw64-x86_64-gcc-g++ mingw64-x86_64-headers mingw64-x86_64-windows-default-manifest mingw64-x86_64-binutils make
          - name: toxcore flags
            mode: toxcore-flags
            expect: hang
            packages: cmake=4.4.4-1 libuv1=1.53.0-1 cygwin=3.6.11-1 mingw64-x86_64-gcc-core mingw64-x86_64-gcc-g++ mingw64-x86_64-binutils make
          - name: toxcore tree
            mode: toxcore-tree
            expect: hang
            packages: cmake=4.4.4-1 libuv1=1.53.0-1 cygwin=3.6.11-1 mingw64-x86_64-gcc-core mingw64-x86_64-gcc-g++ mingw64-x86_64-binutils make git
    steps:
      - uses: actions/checkout@v7

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          add-to-path: false
          packages: ${{ matrix.packages }}

      - name: Run ABI check
        shell: D:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        env:
          CHERE_INVOKING: "1"
          EXPECT: ${{ matrix.expect }}
          MODE: ${{ matrix.mode }}
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          sh ./run.sh
