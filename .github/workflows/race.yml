name: race

on:
  push:
    paths:
      - '.github/workflows/race.yml'
      - 'race.c'
  workflow_dispatch:

jobs:
  sigchld:
    name: uv_spawn SIGCHLD race
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          add-to-path: false
          packages: libuv1=1.53.0-1 libuv-devel=1.53.0-1 cygwin=3.6.11-1 gcc-core mingw64-x86_64-gcc-core

      - name: Spawn short children through libuv
        shell: D:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        env:
          CHERE_INVOKING: "1"
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          gcc -Wall -Wextra -o race race.c -luv
          set +e
          ./race 40 ignore /usr/bin/true
          echo "true_ignore_rc=$?"
          ./race 40 ignore /usr/bin/x86_64-w64-mingw32-gcc.exe --version
          echo "mingw_ignore_rc=$?"
          ./race 40 pipe /usr/bin/x86_64-w64-mingw32-gcc.exe --version
          echo "mingw_pipe_rc=$?"
          ./race 40 ignore /cygdrive/c/Windows/System32/cmd.exe /c exit
          echo "cmd_ignore_rc=$?"
          exit 0

  cmake-strace:
    name: waitpid inside hung cmake
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          add-to-path: false
          packages: cmake=4.4.4-1 libuv1=1.53.0-1 cygwin=3.6.11-1 cygwin-debuginfo=3.6.11-1 mingw64-x86_64-gcc-core mingw64-x86_64-gcc-g++ mingw64-x86_64-binutils gdb

      - name: On hang, waitpid inside cmake
        shell: D:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        env:
          CHERE_INVOKING: "1"
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          i=1
          while [ "$i" -le 15 ]; do
            rm -rf _build cmake.out
            echo "=== attempt $i ==="
            cmake --debug-trycompile \
              -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
              -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
              -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
              -DCMAKE_SYSTEM_NAME=Windows \
              -B_build -H. >cmake.out 2>&1 &
            pid=$!
            waited=0
            while kill -0 "$pid" 2>/dev/null; do
              sleep 1
              waited=$((waited + 1))
              if [ "$waited" -ge 20 ]; then
                echo "HANG attempt $i pid=$pid"
                ps -ef || true
                echo "=== fds ==="
                ls -l "/proc/$pid/fd" || true
                echo "=== waitpid and stack ==="
                gdb -batch -n -p "$pid" \
                  -ex 'set pagination off' \
                  -ex 'set debug-file-directory /usr/lib/debug' \
                  -ex 'set $st = -999' \
                  -ex 'print (int)waitpid(-1, &$st, 1)' \
                  -ex 'print $st' \
                  -ex 'print errno' \
                  -ex 'thread 1' \
                  -ex 'bt 12' || true
                echo "=== cmake tail ==="
                tail -n 15 cmake.out || true
                hangpid=$pid
                kill -9 "$hangpid" 2>/dev/null || true
                exit 0
              fi
            done
            wait "$pid" || true
            echo "FINISHED attempt $i in ${waited}s"
            i=$((i + 1))
          done
          echo "SUMMARY no hang in 15 attempts"
          exit 0
