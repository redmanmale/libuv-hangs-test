name: probe

on:
  push:
    paths:
      - '.github/workflows/probe.yml'
      - 'probe.sh'
      - 'probe-spawn.c'
  workflow_dispatch:

jobs:
  handshake:
    name: posix_spawn probe libuv 1.53.0-1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          add-to-path: false
          packages: cmake=4.4.4-1 libuv1=1.53.0-1 cygwin=3.6.11-1 mingw64-x86_64-gcc-core mingw64-x86_64-gcc-g++ mingw64-x86_64-binutils gcc-core gdb

      - name: Probe handshake
        shell: D:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        env:
          CHERE_INVOKING: "1"
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          sh ./probe.sh
